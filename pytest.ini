[pytest]
asyncio_mode = auto
# One event loop for the whole run, because the app keeps global DB and Redis
# connection pools that must not be shared across different loops.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# The container user cannot write a cache directory in /srv.
addopts = -p no:cacheprovider
testpaths = tests
